[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kubelka-munk"
version = "0.1.0"
description = "Mixing artists' paints with Kubelka-Munk theory, and finding the proportions that match a colour"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
# The library itself needs only numpy and scipy. These are for the example programs:
# Pillow to draw and save images, rembg to cut a subject out of its background.
examples = ["Pillow>=10", "rembg>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kubelka_munk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
